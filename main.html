
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AINT(Artificial Intelligence New Testing)</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="aintIcon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');
    </style>
</head>

<body>
    <header>
        <a href="main.html" class="page-button">Student</a>
        <h1> Artificial Intelligent Testing Center </h1>
        <a href="admin.html" class="page-button">Admin</a>
    
    </header>

    <div class="main-container">
        <div class="center-screen">

            <div class="exam-info" id="examInfo">
                <input class="student-name" type="text" placeholder="Your full name">
                <input class="test-code" type="text" placeholder="Test Code">
                <p class="proctored-info"> This is a proctored exam. do not leave the testing area. You must accept the terms and conditions to proceed.</p>
            </div>
            <div class="avatar-container">
                <img id="ai-avatar" src="aint_avatar_frames/01_neutral.png" alt="AINT AI speaking avatar">
            </div>

            <div class="test-controls">
                <div class="timer">0:00</div>
                <button class="start">Start</button>
            </div>
        </div>
        <div class="question-output">
            <button id="replayButton" class="replay-btn" type="button"
                    title="Replay question audio" aria-label="Replay question audio">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 3-6.7"/>
                <polyline points="3 4 3 10 9 10"/>
                </svg>
            </button>
            <p class="question-text"></p>
            <div class="evaluation">
                <p>AI evaluation will appear here.</p>
            </div>
        </div>
        <div class="response-container">
            <h3>Student Response</h3>

            <div class="response-row">
                <button class="listen" disabled>Start Listening</button>
                <textarea class="response" placeholder="Your spoken response will appear here..." disabled></textarea>
            </div>
            <button class="evaluate" disabled>
                Evaluate Response
            </button>
            <button type="button" id="next-button" disabled>Next Question</button>
        </div>

    </div>



    <footer>
        <p>&copy; 2026 Artificial Intelligent Testing Center. All rights reserved.</p>
    </footer>

    <!-- Order matters: core first, main last -->
    <script src="js/core.js"></script>
    <script src="js/proctoring.js"></script>
    <script src="js/avatar-speech.js"></script>
    <script src="js/student-exam.js"></script>
    <script src="js/student-voice.js"></script>
    <script src="js/admin-login.js"></script>
    <script src="js/admin-tests.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
